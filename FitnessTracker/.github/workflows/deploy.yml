name: deploy-application

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:latest -t ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:v${{ github.run_number }} .
        docker push ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/fitness-tracker:v${{ github.run_number }}

    - name: Run application with docker compose
      run: docker compose up -d

    - name: verify the container status
      run: docker ps
